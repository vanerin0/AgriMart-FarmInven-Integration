<!DOCTYPE html>
<html>

<head>

<title>

Register

</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card p-4 shadow">

<h2>

FarmInven Register

</h2>

<form method="POST">

<input
class="form-control mb-3"
name="fullname"
placeholder="Full Name"
required
>

<input
class="form-control mb-3"
name="email"
placeholder="Email"
required
>

<input
type="password"
class="form-control mb-3"
name="password"
placeholder="Password"
required
>

<select
class="form-control mb-3"
name="role"
>

<option value="farmer">

Farmer

</option>

<option value="admin">

Admin

</option>

</select>

<button
class="btn btn-success w-100"
>

Register

</button>

</form>

<br>

<a href="/login">

Already have account?

</a>

</div>

</div>

</body>
</html>
