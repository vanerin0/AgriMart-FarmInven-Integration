<!doctype html>
<html>
  <head>
    <title>FarmInven Inventory</title>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(135deg, #eef7ee, #f5f7fa);

        font-family: Arial, sans-serif;
      }

      .navbar {
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      .card {
        border: none;

        border-radius: 20px;

        overflow: hidden;

        transition: 0.3s;

        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }

      .card:hover {
        transform: translateY(-6px);
      }

      .product-image {
        height: 220px;

        object-fit: cover;
      }

      .stock {
        font-weight: bold;

        color: #198754;
      }

      .uuid {
        font-size: 12px;

        color: gray;
      }

      .title {
        margin-bottom: 25px;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#"> 🌱 FarmInven </a>

        <div>
          <a href="/dashboard" class="btn btn-light me-2">
            <i class="bi bi-speedometer2"></i>

            Dashboard
          </a>

          <a href="/addProduct" class="btn btn-warning me-2">
            <i class="bi bi-plus-circle"></i>

            Add Product
          </a>

          <a href="/logs" class="btn btn-info me-2">
            <i class="bi bi-clock-history"></i>

            Logs
          </a>

          <a
href="/reports"
class="btn btn-secondary me-2"
>

Reports

</a>

          <a href="/logout" class="btn btn-danger"> Logout </a>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <div class="title">
        <h1>Inventory Products</h1>

        <p>Manage your inventory products and stocks</p>
      </div>

      <div class="row">
        {% for p in products %}

        <div class="col-md-4 mb-4">
          <div class="card h-100">
            {% if p[4] %}

            <img src="/static/uploads/{{p[4]}}" class="product-image" />

            {% else %}

            <img
              src="https://placehold.co/600x400?text=No+Image"
              class="product-image"
            />

            {% endif %}

            <div class="card-body">
              <h4>{{p[1]}}</h4>

              <div class="uuid">UUID: {{p[2]}}</div>

              <br />

              <div class="stock">Stock: {{p[3]}}</div>

              <br />

              <a
                href="/editProduct/{{p[0]}}"
                class="btn btn-warning w-100 mb-2"
              >
                <i class="bi bi-pencil-square"></i>

                Edit Product
              </a>

              <a
                href="/deleteProduct/{{p[0]}}"
                class="btn btn-danger w-100"
                onclick="return confirm('Delete this product?');"
              >
                <i class="bi bi-trash"></i>

                Delete Product
              </a>
            </div>
          </div>
        </div>

        {% endfor %}
      </div>
    </div>
  </body>
</html>
