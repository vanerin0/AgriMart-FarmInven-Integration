<!DOCTYPE html>
<html>

<head>

<title>FarmInven Inventory</title>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1"
>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet"
>

<style>

body{

background:
linear-gradient(
135deg,
#eef7ee,
#f5f7fa
);

}

.navbar{

box-shadow:
0 4px 15px rgba(0,0,0,.1);

}

.card{

border:none;

border-radius:20px;

overflow:hidden;

transition:.3s;

box-shadow:
0 8px 20px rgba(0,0,0,.08);

}

.card:hover{

transform:
translateY(-6px);

}

.product-image{

height:220px;

width:100%;

object-fit:cover;

}

.stock{

font-weight:bold;

color:#198754;

}

.uuid{

font-size:12px;

color:gray;

}

</style>

</head>

<body>


<nav class="navbar navbar-dark bg-success p-3">

<div class="container">

<h3>

🌾 FarmInven Inventory

</h3>

<div>

<a
href="/dashboard"
class="btn btn-light"
>

Dashboard

</a>


<a
href="/addProduct"
class="btn btn-primary"
>

+ Add Product

</a>


<a
href="/logs"
class="btn btn-warning"
>

Logs

</a>


<a
href="/reports"
class="btn btn-info"
>

Reports

</a>

<a
href="/logout"
class="btn btn-dark"
>

Logout

</a>

</div>

</div>

</nav>



<div class="container mt-5">


<div class="row">


{% for p in products %}


<div class="col-md-4 mb-4">

<div class="card">


<img

src="{{ url_for('static', filename='uploads/' ~ p[4]) }}"

alt="{{ p[1] }}"

class="product-image"

>


<div class="card-body">

<h4>

{{p[1]}}

</h4>


<div class="uuid">

UUID:

{{p[2]}}

</div>


<br>


<div class="stock">

Stock:

{{p[3]}}

</div>


<br>


<a

href="/editProduct/{{p[0]}}"

class="btn btn-success"

>

Edit

</a>


<a

href="/deleteProduct/{{p[0]}}"

class="btn btn-danger"

onclick="return confirm('Delete product?')"

>

Delete

</a>


</div>

</div>

</div>


{% endfor %}


</div>

</div>


</body>

</html>
