<!DOCTYPE html>
<html>

<head>

<title>Edit Product</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card p-4">

<h2>Edit Product</h2>

<form
action="/updateProduct/{{product[0]}}"
method="POST"
enctype="multipart/form-data"
>

<input
name="product_name"
class="form-control mb-3"
value="{{product[1]}}"
required
>

<input
type="number"
name="stock_level"
class="form-control mb-3"
value="{{product[3]}}"
required
>

Current Image:

<br><br>

<img
src="{{ url_for('static', filename='uploads/'+product[4]) }}"
width="150"
>

<br><br>

<input
type="file"
name="product_image"
class="form-control"
>

<br>

<button class="btn btn-success">

Update

</button>

</form>

</div>

</div>

</body>

</html>
