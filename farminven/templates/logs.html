<!DOCTYPE html>
<html>

<head>

<title>

Inventory Logs

</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h1>

Inventory Logs

</h1>

<table class="table">

<tr>

<th>Product</th>

<th>Old</th>

<th>New</th>

<th>Action</th>

<th>Date</th>

</tr>

{% for l in logs %}

<tr>

<td>{{l[2]}}</td>

<td>{{l[3]}}</td>

<td>{{l[4]}}</td>

<td>{{l[5]}}</td>

<td>{{l[6]}}</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
