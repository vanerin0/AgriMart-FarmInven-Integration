<!doctype html>
<html>
  <head>
    <title>FarmInven Reports</title>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      body {
        background: linear-gradient(135deg, #eef7ee, #f5f7fa);

        font-family: Arial, sans-serif;
      }

      .card {
        border: none;

        border-radius: 25px;

        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }

      .metric {
        font-size: 45px;

        font-weight: bold;

        color: #198754;
      }

      .navbar {
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-dark bg-success">
      <div class="container">
        <h3>📊 FarmInven Reports</h3>

        <div>
          <a href="/dashboard" class="btn btn-light me-2"> Dashboard </a>

          <a href="/products" class="btn btn-warning me-2"> Inventory </a>

          <a href="/exportReport" class="btn btn-danger"> Export PDF </a>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <div class="row">
        <div class="col-md-6">
          <div class="card p-4 text-center">
            <h5>Total Products</h5>

            <div class="metric">{{totalProducts}}</div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card p-4 text-center">
            <h5>Total Stock</h5>

            <div class="metric">{{totalStock}}</div>
          </div>
        </div>
      </div>

      <br />

      <div class="card p-4">
        <h3>📦 Inventory Levels</h3>

        <br />

        <canvas id="stockChart"> </canvas>
      </div>

      <br />

      <div class="card p-4">
        <h3>⚠ Low Stock Alerts</h3>

        <br />

        <table class="table table-striped">
          <thead>
            <tr>
              <th>Product</th>

              <th>Remaining Stock</th>
            </tr>
          </thead>

          <tbody>
            {% if lowStock %} {% for p in lowStock %}

            <tr>
              <td>{{p[1]}}</td>

              <td>{{p[3]}}</td>
            </tr>

            {% endfor %} {% else %}

            <tr>
              <td colspan="2">No low stock alerts</td>
            </tr>

            {% endif %}
          </tbody>
        </table>
      </div>
    </div>

    <script>
      const productNames = JSON.parse("{{ names | tojson }}");

      const stockData = JSON.parse("{{ stocks | tojson }}");

      const ctx = document.getElementById("stockChart").getContext("2d");

      new Chart(
        ctx,

        {
          type: "bar",

          data: {
            labels: productNames,

            datasets: [
              {
                label: "Current Stock",

                data: stockData,

                backgroundColor: [
                  "#198754",
                  "#20c997",
                  "#ffc107",
                  "#dc3545",
                  "#0d6efd",
                ],

                borderWidth: 1,
              },
            ],
          },

          options: {
            responsive: true,

            scales: {
              y: {
                beginAtZero: true,
              },
            },
          },
        },
      );
    </script>
  </body>
</html>
