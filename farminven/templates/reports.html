<!doctype html>
<html>

<head>
  <title>FarmInven Reports</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background: linear-gradient(135deg, #eef7ee, #f5f7fa);
    }

    .card {
      border: none;

      border-radius: 25px;

      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-dark bg-success">
    <div class="container">
      <h3>📊 FarmInven Reports</h3>

      <div>
        <a href="/dashboard" class="btn btn-light btn-sm"> Dashboard </a>

        <a href="/products" class="btn btn-warning btn-sm"> Inventory </a>

        <a href="/export-pdf" class="btn btn-danger btn-sm"> Export PDF </a>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row">
      <div class="col-md-6">
        <div class="card p-4 text-center">
          <h6>Total Products</h6>

          <h1 class="text-success">{{totalProducts}}</h1>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card p-4 text-center">
          <h6>Total Stock</h6>

          <h1 class="text-success">{{totalStock}}</h1>
        </div>
      </div>
    </div>

    <br />

    <canvas id="stockChart"></canvas>

<div
id="chartData"
data-names='{{ names|tojson }}'
data-stocks='{{ stocks|tojson }}'
style="display:none;">
</div>
  </div>

<script>

const chartData =
document.getElementById(
"chartData"
);

const productNames =
JSON.parse(
chartData.dataset.names
);

const stockData =
JSON.parse(
chartData.dataset.stocks
);

console.log(productNames);
console.log(stockData);

const ctx=
document
.getElementById(
"stockChart"
);

new Chart(

ctx,

{

type:"bar",

data:{

labels:productNames,

datasets:[{

label:"Current Stock",

data:stockData,

backgroundColor:[
"#198754",
"#20c997",
"#ffc107",
"#dc3545",
"#0d6efd"
]

}]

},

options:{

responsive:true,

scales:{

y:{

beginAtZero:true

}

}

}

}

);

</script>
</body>

</html>
