<!DOCTYPE html>
<html lang="en">

<head>

<title>Add Product | FarmInven</title>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1"
/>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
/>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet"
/>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet"
/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

min-height:100vh;

background:
linear-gradient(
135deg,
#eef7ee,
#f4f8fb
);

display:flex;

justify-content:center;

align-items:center;

padding:40px 15px;

overflow-x:hidden;

}

/* MAIN CARD */

.product-card{

width:100%;

max-width:700px;

background:white;

border-radius:35px;

padding:40px;

box-shadow:
0 15px 40px rgba(0,0,0,.08);

position:relative;

overflow:hidden;

}

/* BACKGROUND CIRCLES */

.product-card::before{

content:"";

position:absolute;

top:-60px;
right:-60px;

width:180px;
height:180px;

background:
rgba(25,135,84,.08);

border-radius:50%;

}

.product-card::after{

content:"";

position:absolute;

bottom:-80px;
left:-80px;

width:220px;
height:220px;

background:
rgba(13,110,253,.06);

border-radius:50%;

}

/* HEADER */

.header{

position:relative;

z-index:2;

text-align:center;

margin-bottom:35px;

}

.header-icon{

width:90px;
height:90px;

background:
linear-gradient(
135deg,
#198754,
#20c997
);

border-radius:25px;

display:flex;

justify-content:center;
align-items:center;

font-size:40px;

color:white;

margin:auto;

margin-bottom:20px;

box-shadow:
0 10px 25px rgba(25,135,84,.25);

}

.header h1{

font-size:38px;

font-weight:700;

color:#1b4332;

margin-bottom:10px;

}

.header p{

color:#6c757d;

font-size:16px;

}

/* FORM */

.form-group{

margin-bottom:25px;

position:relative;

z-index:2;

}

.form-label{

font-weight:600;

margin-bottom:10px;

color:#1b4332;

}

.form-control{

height:58px;

border:none;

border-radius:18px;

background:#f5f7fb;

padding:15px 20px;

font-size:15px;

transition:.3s;

}

.form-control:focus{

background:white;

border:2px solid #198754;

box-shadow:
0 0 0 4px rgba(25,135,84,.1);

}

/* FILE INPUT */

.file-upload{

position:relative;

overflow:hidden;

border-radius:20px;

background:#f5f7fb;

padding:30px;

text-align:center;

transition:.3s;

cursor:pointer;

border:2px dashed #cfd8dc;

}

.file-upload:hover{

background:#eef7ee;

border-color:#198754;

}

.file-upload i{

font-size:45px;

color:#198754;

margin-bottom:15px;

display:block;

}

.file-upload p{

margin:0;

color:#6c757d;

font-size:15px;

}

.file-upload input{

position:absolute;

left:0;
top:0;

width:100%;
height:100%;

opacity:0;

cursor:pointer;

}

/* BUTTONS */

.buttons{

display:flex;

gap:15px;

margin-top:30px;

position:relative;

z-index:2;

}

.btn-custom{

flex:1;

height:58px;

border:none;

border-radius:18px;

font-size:16px;

font-weight:600;

transition:.3s;

display:flex;

justify-content:center;

align-items:center;

gap:10px;

text-decoration:none;

}

.save-btn{

background:
linear-gradient(
135deg,
#198754,
#20c997
);

color:white;

box-shadow:
0 10px 25px rgba(25,135,84,.25);

}

.save-btn:hover{

transform:
translateY(-3px);

color:white;

}

.back-btn{

background:
linear-gradient(
135deg,
#6c757d,
#495057
);

color:white;

}

.back-btn:hover{

transform:
translateY(-3px);

color:white;

}

/* PREVIEW */

.preview-container{

margin-top:20px;

display:none;

text-align:center;

}

.preview-image{

width:180px;

height:180px;

object-fit:cover;

border-radius:25px;

box-shadow:
0 10px 25px rgba(0,0,0,.1);

}

/* MOBILE */

@media(max-width:768px){

.product-card{

padding:30px 25px;

}

.header h1{

font-size:30px;

}

.buttons{

flex-direction:column;

}

}

</style>

</head>

<body>

<div class="product-card">

<!-- HEADER -->

<div class="header">

<div class="header-icon">

<i class="bi bi-plus-circle-fill"></i>

</div>

<h1>

Add Product

</h1>

<p>

Upload farm products, monitor stocks,
and synchronize inventory with AgriMart.

</p>

</div>

<!-- FORM -->

<form

action="/save-product"

method="POST"

enctype="multipart/form-data"

>

<!-- PRODUCT NAME -->

<div class="form-group">

<label class="form-label">

Product Name

</label>

<input

type="text"

name="product_name"

class="form-control"

placeholder="Enter product name"

required

>

</div>

<!-- STOCK -->

<div class="form-group">

<label class="form-label">

Stock Level

</label>

<input

type="number"

name="stock_level"

class="form-control"

placeholder="Enter available stock"

required

>

</div>

<!-- IMAGE -->

<div class="form-group">

<label class="form-label">

Product Image

</label>

<div class="file-upload">

<i class="bi bi-cloud-arrow-up-fill"></i>

<p>

Click or drag image here to upload

</p>

<input

type="file"

name="product_image"

accept="image/*"

required

onchange="previewImage(event)"

>

</div>

<div class="preview-container" id="previewContainer">

<img
id="preview"
class="preview-image"
>

</div>

</div>

<!-- BUTTONS -->

<div class="buttons">

<button
type="submit"
class="btn-custom save-btn"
>

<i class="bi bi-check-circle-fill"></i>

Save Product

</button>

<a
href="/products"
class="btn-custom back-btn"
>

<i class="bi bi-arrow-left-circle-fill"></i>

Back

</a>

</div>

</form>

</div>

<!-- PREVIEW SCRIPT -->

<script>

function previewImage(event){

const reader=
new FileReader();

reader.onload=function(){

const output=
document.getElementById(
'preview'
);

output.src=
reader.result;

document.getElementById(
'previewContainer'
).style.display='block';

}

reader.readAsDataURL(
event.target.files[0]
);

}

</script>

</body>

</html>
