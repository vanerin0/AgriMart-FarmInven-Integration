<!DOCTYPE html>
<html>

<head>

<title>Add Product</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<style>

body{

background:
linear-gradient(
135deg,
#eef7ee,
#f5f7fa
);

}

.card{

border:none;

border-radius:25px;

}

</style>

</head>

<body>


<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow p-4">

<h2 class="mb-4">

➕ Add Product

</h2>


<form

action="/save-product"

method="POST"

enctype="multipart/form-data"

>

<input

type="text"

name="product_name"

class="form-control mb-3"

placeholder="Product Name"

required

>


<input

type="number"

name="stock_level"

class="form-control mb-3"

placeholder="Stock"

required

>


<input

type="file"

name="product_image"

class="form-control mb-3"

required

>


<button

class="btn btn-success w-100"

>

Save Product

</button>


<br><br>


<a

href="/products"

class="btn btn-secondary w-100"

>

Back

</a>


</form>

</div>

</div>

</div>

</div>


</body>

</html>
